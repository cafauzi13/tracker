<html lang="id">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyList — Tracker Mingguan</title>
<meta name="theme-color" content="#181f1d">
<meta name="description" content="Tracker checklist mingguan — jadwal kuliah, deadline, fokus harian, dan jangkar ibadah/olahraga.">

<style>
  :root{
    --ink:#181f1d;
    --surface:#212a27;
    --surface-2:#2a3531;
    --line:#3a453f;
    --paper:#ece7db;
    --paper-dim:#a9a89b;
    --gold:#c9a24a;
    --rust:#b5573a;
    --moss:#7fa07a;
    --moss-dim:#3f4c42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  header{margin-bottom:20px;}
  .eyebrow{font-size:13px;color:var(--gold);margin:0 0 6px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:30px;
    line-height:1.15;
    margin:0 0 10px;
  }
  .quote{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:14.5px;
    color:var(--paper-dim);
    border-left:2px solid var(--gold);
    padding-left:12px;
    margin:14px 0 0;
    line-height:1.5;
  }
  .week-progress{margin-top:18px;}
  .week-progress-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--paper-dim);margin-bottom:6px;}
  .bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .4s ease;}

  .controls-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}
  .week-select-wrap{
    display:flex;align-items:center;gap:8px;
    flex:1 1 200px;
    font-size:12.5px;color:var(--paper-dim);
  }
  .week-select-wrap select{
    flex:1;min-width:0;
    background:var(--surface);border:1px solid var(--line);color:var(--paper);
    border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:'Inter',sans-serif;
  }

  .btn{
    padding:8px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--paper);font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;
  }
  .btn:hover{border-color:var(--gold);}
  .btn.active{background:var(--gold);border-color:var(--gold);color:#20190a;}
  .btn-ghost{background:transparent;}
  .btn-danger{border-color:rgba(181,87,58,.6);color:#e2926f;}
  .btn-danger:disabled{opacity:.4;cursor:not-allowed;}

  #editPanelSlot{margin-top:14px;}
  .edit-panel h2{
    font-family:'Fraunces',serif;font-weight:500;font-size:15.5px;margin:0 0 12px;color:var(--paper);
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12px;color:var(--paper-dim);margin-bottom:5px;}
  .f-input{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--paper);
    border-radius:8px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;
  }
  .f-input:focus{outline:none;border-color:var(--gold);}
  .panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

  .tabs{
    display:flex;gap:6px;overflow-x:auto;
    margin:24px 0 20px;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 13px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--paper-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
    line-height:1.25;
  }
  .tab .d{display:block;font-size:10.5px;font-weight:500;opacity:.75;}
  .tab.active{background:var(--gold);border-color:var(--gold);color:#20190a;}
  .tab.today:not(.active){border-color:var(--gold);color:var(--gold);}
  .tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--moss);margin-left:4px;vertical-align:middle;}

  .day{display:none;}
  .day.active{display:block;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px 6px;
    margin-bottom:14px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:15.5px;
    margin:0 0 10px;
    color:var(--paper);
  }
  .card.deadline{border-color:rgba(181,87,58,.55);background:linear-gradient(180deg, rgba(181,87,58,.14), rgba(181,87,58,.03));}
  .card.deadline h2{color:#e2926f;}
  .card.agenda{border-color:rgba(201,162,74,.5);background:linear-gradient(180deg, rgba(201,162,74,.13), rgba(201,162,74,.02));}
  .card.agenda h2{color:var(--gold);}

  .kuliah-row{
    display:flex;justify-content:space-between;gap:10px;
    font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);
  }
  .kuliah-row:last-child{border-bottom:none;}
  .kuliah-row .mk{font-weight:600;}
  .kuliah-row .rm{color:var(--paper-dim);font-size:12px;white-space:nowrap;}

  .item{
    display:flex;align-items:flex-start;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .item:last-child{border-bottom:none;}
  .box{
    flex:0 0 19px;width:19px;height:19px;margin-top:1px;
    border-radius:6px;border:1.5px solid var(--paper-dim);
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .box svg{width:12px;height:12px;opacity:0;transition:opacity .15s ease;}
  .item.checked .box{background:var(--moss);border-color:var(--moss);}
  .item.checked .box svg{opacity:1;}
  .item.checked .label{color:var(--paper-dim);text-decoration:line-through;text-decoration-color:var(--moss-dim);}
  .label{font-size:14px;line-height:1.4;}
  .sub{display:block;font-size:12px;color:var(--paper-dim);margin-top:1px;}
  .empty-hint{font-size:13px;color:var(--paper-dim);padding:9px 0;}

    font-size:12.5px;font-weight:500;color:var(--paper-dim);
    cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:6px;
  }
  .pillcheck.checked{background:var(--moss-dim);border-color:var(--moss);color:var(--paper);}
  .pillcheck .dot2{width:6px;height:6px;border-radius:50%;background:var(--paper-dim);}
  .pillcheck.checked .dot2{background:var(--moss);}

  .notes{
    width:100%;
    min-height:84px;
    resize:vertical;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:12px;
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    line-height:1.5;
  }
  .notes::placeholder{color:var(--paper-dim);}
  .notes:focus{outline:none;border-color:var(--gold);}

  /* --- edit mode --- */
  .edit-row{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
  .edit-row:last-of-type{border-bottom:none;}
  .edit-row .f-input{flex:1;min-width:0;}
  .del-btn{
    flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--paper-dim);
    width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1;
  }
  .del-btn:hover{border-color:var(--rust);color:#e2926f;}
  .del-btn.small{width:20px;height:20px;font-size:11px;}

  .add-row-btn{
    margin-top:8px;width:100%;padding:8px;border-radius:8px;
    border:1px dashed var(--line);background:transparent;color:var(--paper-dim);
    font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .add-row-btn:hover{border-color:var(--gold);color:var(--gold);}
  .add-row-btn.small{width:auto;padding:6px 10px;margin-top:0;}

  .edit-pill{padding:4px 6px 4px 10px;}
  .pill-input{
    background:transparent;border:none;color:var(--paper);font-size:12.5px;
    font-family:'Inter',sans-serif;width:110px;
  }
  .pill-input:focus{outline:none;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:20px;max-width:360px;width:100%;
  }
  .modal-card h2{font-family:'Fraunces',serif;font-weight:500;font-size:17px;margin:0 0 8px;}
  .modal-desc{font-size:12.5px;color:var(--paper-dim);margin:0 0 14px;line-height:1.5;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  footer{margin-top:22px;text-align:center;}
  footer p{font-size:11.5px;color:var(--paper-dim);}
</style>
</head>
<body>
<div class="wrap">

    <div class="week-progress">

const SEED_ANCHORS = ["Subuh","Dzuhur","Ashar","Maghrib","Isya","Hafalan 15–20 menit","IELTS 30–45 menit","Olahraga 20–30 menit"];

// ============================================================
// akhir blok seed
// ============================================================

// ---- penyimpanan lokal (localStorage) ----
const STORE_PREFIX = 'pekanini:';

function lsGet(key){
  try{ return localStorage.getItem(STORE_PREFIX+key); }
  catch(e){ console.error('gagal baca', e); return null; }
}
function lsSet(key, val){
  try{ localStorage.setItem(STORE_PREFIX+key, val); }
  catch(e){ console.error('gagal simpan', e); }
}
function lsRemove(key){
  try{ localStorage.removeItem(STORE_PREFIX+key); }
  catch(e){ console.error('gagal hapus', e); }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return isoDate(new Date()); }

const DAY_NAMES = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MONTH_LONG = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function shortDate(d){ return d.getDate()+' '+MONTH_SHORT[d.getMonth()]; }

function makeWeekDays(startDate){
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(startDate);
    d.setDate(d.getDate()+i);
    days.push({ id: isoDate(d), label: DAY_NAMES[d.getDay()], date: shortDate(d), tag: "", kuliah: [], agenda: [], deadlines: [], focus: [] });
  }
  return days;
}

function weekLabelFor(days){
  const fd = new Date(days[0].id+'T00:00:00');
  const ld = new Date(days[days.length-1].id+'T00:00:00');
  if(fd.getMonth()===ld.getMonth() && fd.getFullYear()===ld.getFullYear()){
    return `${fd.getDate()} – ${ld.getDate()} ${MONTH_LONG[ld.getMonth()]} ${ld.getFullYear()}`;
  }
  if(fd.getFullYear()===ld.getFullYear()){
    return `${fd.getDate()} ${MONTH_LONG[fd.getMonth()]} – ${ld.getDate()} ${MONTH_LONG[ld.getMonth()]} ${ld.getFullYear()}`;
  }
  return `${fd.getDate()} ${MONTH_LONG[fd.getMonth()]} ${fd.getFullYear()} – ${ld.getDate()} ${MONTH_LONG[ld.getMonth()]} ${ld.getFullYear()}`;
}

// ---- normalisasi bentuk data (supaya seed lama & data baru konsisten) ----
function normList(arr){
  return (arr||[]).map((it,i)=>{
    if(it && typeof it === 'object' && 'id' in it) return it;
    if(typeof it === 'string') return { id:String(i), text:it };
    return Object.assign({ id:String(i) }, it);
  });
}
function normalizeDay(raw){
  return {
    id: raw.id, label: raw.label, date: raw.date, tag: raw.tag || "",
    kuliah: normList(raw.kuliah),
    agenda: normList(raw.agenda),
    deadlines: normList(raw.deadlines),
    focus: normList(raw.focus)
  };
}
function normalizeAnchors(raw){ return normList(raw); }

// ---- penyimpanan pekan ----
function getWeekIndex(){ try{ return JSON.parse(lsGet('weeks')) || []; }catch(e){ return []; } }
function setWeekIndex(idx){ lsSet('weeks', JSON.stringify(idx)); }
function getWeekRaw(weekId){ try{ return JSON.parse(lsGet('week:'+weekId)); }catch(e){ return null; } }

function saveWeek(weekObj){
  weekObj.savedAt = new Date().toISOString();
  lsSet('week:'+weekObj.weekId, JSON.stringify(weekObj));
  const idx = getWeekIndex();
  if(!idx.includes(weekObj.weekId)){
    idx.push(weekObj.weekId);
    idx.sort();
    setWeekIndex(idx);
  }
}
function loadWeek(weekId){
  const raw = getWeekRaw(weekId);
  if(!raw) return null;
  return {
    weekId: raw.weekId,
    label: raw.label,
    days: (raw.days||[]).map(normalizeDay),
    anchors: normalizeAnchors(raw.anchors)
  };
}
function deleteWeek(weekId){
  lsRemove('week:'+weekId);
  setWeekIndex(getWeekIndex().filter(id=>id!==weekId));
}

function ensureSeeded(){
  if(getWeekIndex().length > 0) return;
  saveWeek({ weekId: SEED_DAYS[0].id, label: SEED_WEEK_LABEL, days: SEED_DAYS, anchors: SEED_ANCHORS });
}

function pickHomeWeekId(){
  const idx = getWeekIndex();
  if(idx.length === 0) return null;
  const t = todayISO();
  for(const id of idx){
    const w = loadWeek(id);
    if(w && w.days.length && t >= w.days[0].id && t <= w.days[w.days.length-1].id) return id;
  }
  return idx.slice().sort().pop();
}

// ---- state aktif ----
let state = {};
let activeWeekId = null;
let activeWeek = null;
let editMode = false;

function checkSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#12201a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>';
}

function itemKey(dayId, section, id){ return dayId+":"+section+":"+id; }

function debounce(fn, wait){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=> fn.apply(this,args), wait); };
}
const persistActiveWeek = debounce(()=>{ if(activeWeek) saveWeek(activeWeek); }, 400);

function dayTotalAndDone(day, anchors){
  let total=0, done=0;
  day.deadlines.forEach(dl=>{ total++; if(state[itemKey(day.id,'deadline',dl.id)]) done++; });
  day.focus.forEach(f=>{ total++; if(state[itemKey(day.id,'focus',f.id)]) done++; });
  anchors.forEach(a=>{ total++; if(state[itemKey(day.id,'anchor',a.id)]) done++; });
  return {total, done};
}

function loadState(days, anchors){
  const s = {};
  days.forEach(d=>{
    d.deadlines.forEach(dl=>{ const k=itemKey(d.id,'deadline',dl.id); if(lsGet('check:'+k)==="1") s[k]=true; });
    d.focus.forEach(f=>{ const k=itemKey(d.id,'focus',f.id); if(lsGet('check:'+k)==="1") s[k]=true; });
    anchors.forEach(a=>{ const k=itemKey(d.id,'anchor',a.id); if(lsGet('check:'+k)==="1") s[k]=true; });
  });
  return s;
}

// ---- render: mode baca (tampilan normal) ----
function renderTabs(activeId, days){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = "";
  const t = todayISO();
  days.forEach(d=>{
    const tab = document.createElement('div');
    tab.className = 'tab' + (d.id===activeId?' active':'') + (d.id===t?' today':'');
    tab.innerHTML = `${d.label}<span class="d">${d.date}</span>`;
    tab.onclick = ()=> showDay(d.id);
    tabs.appendChild(tab);
  });
}

function renderDay(day, anchors){
  const wrap = document.createElement('div');
  wrap.className = 'day';
  wrap.id = 'day-'+day.id;

  let html = "";

  if(day.kuliah.length){
    html += `<div class="card"><h2>Kuliah</h2>`;
    day.kuliah.forEach(k=>{
      html += `<div class="kuliah-row"><span class="mk">${k.mk} · ${k.waktu}</span><span class="rm">${k.ruang}</span></div>`;
    });
    html += `</div>`;
  }

  if(day.agenda.length){
    html += `<div class="card agenda"><h2>Agenda</h2>`;
    day.agenda.forEach(a=>{
      html += `<div class="kuliah-row"><span class="mk">${a.judul}${a.waktu? ' · '+a.waktu:''}${a.ket?`<span class="sub">${a.ket}</span>`:''}</span></div>`;
    });
    html += `</div>`;
  }

  if(day.deadlines.length){
    html += `<div class="card deadline"><h2>Deadline hari ini</h2>`;
    day.deadlines.forEach(dl=>{
      html += `<div class="item" data-key="${itemKey(day.id,'deadline',dl.id)}"><div class="box"></div><div class="label">${dl.judul}${dl.ket?`<span class="sub">${dl.ket}</span>`:''}</div></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="card"><h2>Fokus utama</h2>`;
  if(day.focus.length){
    day.focus.forEach(f=>{
      html += `<div class="item" data-key="${itemKey(day.id,'focus',f.id)}"><div class="box"></div><div class="label">${f.text}</div></div>`;
    });
  }else{
    html += `<div class="empty-hint">Belum ada fokus untuk hari ini. Ketuk "✏️ Edit pekan" untuk menambahkan.</div>`;
  }
  html += `</div>`;

  html += `<div class="card"><h2>Jangkar harian</h2><div class="anchors-grid">`;
  anchors.forEach(a=>{
    html += `<div class="pillcheck" data-key="${itemKey(day.id,'anchor',a.id)}"><span class="dot2"></span>${a.text}</div>`;
  });
  html += `</div></div>`;

  html += `<div class="card"><h2>Catatan, reminder & diary</h2>
    <textarea class="notes" data-day="${day.id}" placeholder="Tulis catatan bebas, pengingat, atau refleksi singkat hari ini..."></textarea>
  </div>`;

  wrap.innerHTML = html;

  const ta = wrap.querySelector('textarea.notes');
  ta.value = lsGet('note:'+day.id) || '';

  return wrap;
}

function applyState(container){
  container.querySelectorAll('.item[data-key]').forEach(el=>{
    const k = el.dataset.key;
    el.classList.toggle('checked', !!state[k]);
    const box = el.querySelector('.box');
    box.innerHTML = state[k] ? checkSvg() : "";
  });
  container.querySelectorAll('.pillcheck[data-key]').forEach(el=>{
    const k = el.dataset.key;
    el.classList.toggle('checked', !!state[k]);
  });
}

function toggle(key){
  state[key] = !state[key];
  lsSet('check:'+key, state[key] ? "1" : "0");
  applyState(document);
  updateWeekProgress();
}

function updateWeekProgress(){
  let total=0, done=0;
  activeWeek.days.forEach(d=>{
    const r = dayTotalAndDone(d, activeWeek.anchors);
    total += r.total; done += r.done;
  });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('weekPct').textContent = pct+'%';
  document.getElementById('weekBar').style.width = pct+'%';
}

function showDay(id){
  document.querySelectorAll('.day').forEach(d=> d.classList.toggle('active', d.id === 'day-'+id));
  renderTabs(id, activeWeek.days);
}

document.addEventListener('click', (e)=>{
  const item = e.target.closest('.item[data-key], .pillcheck[data-key]');
  if(item) toggle(item.dataset.key);
});

document.addEventListener('input', (e)=>{
  const ta = e.target.closest('textarea.notes[data-day]');
  if(ta) lsSet('note:'+ta.dataset.day, ta.value);
});

// ---- render: mode edit ----
function el(tag, attrs, ...children){
  const node = document.createElement(tag);
  if(attrs){
    Object.keys(attrs).forEach(k=>{
      const v = attrs[k];
      if(v === undefined || v === null) return;
      if(k === 'class'){ node.className = v; }
      else if(k === 'value'){ node.value = v; }
      else if(k.indexOf('on') === 0 && typeof v === 'function'){ node.addEventListener(k.slice(2), v); }
      else if(typeof v === 'boolean'){ if(v) node.setAttribute(k, ''); }
      else{ node.setAttribute(k, v); }
    });
  }
  children.flat(Infinity).forEach(c=>{
    if(c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

function fieldInput(value, placeholder, onInput, type){
  return el('input', {
    class: 'f-input',
    type: type || 'text',
    placeholder: placeholder || '',
    value: value || '',
    oninput: (e)=>{ onInput(e.target.value); persistActiveWeek(); }
  });
}

function editRow(fields, onDelete){
  return el('div', {class:'edit-row'}, ...fields, el('button', {class:'del-btn', type:'button', 'aria-label':'Hapus', onclick:onDelete}, '✕'));
}

function renderKuliahEditor(day){
  const box = el('div', {class:'card'}, el('h2', null, 'Kuliah'));
  day.kuliah.forEach(k=>{
    box.appendChild(editRow([
      fieldInput(k.mk, 'Mata kuliah', v=>k.mk=v),
      fieldInput(k.waktu, 'Jam (mis. 09.40–11.20)', v=>k.waktu=v),
      fieldInput(k.ruang, 'Ruang', v=>k.ruang=v)
    ], ()=>{ day.kuliah = day.kuliah.filter(x=>x.id!==k.id); saveWeek(activeWeek); refreshActiveWeekView(); }));
  });
  box.appendChild(el('button', {class:'add-row-btn', type:'button', onclick:()=>{
    day.kuliah.push({id:uid(), mk:'', waktu:'', ruang:''});
    saveWeek(activeWeek); refreshActiveWeekView();
  }}, '+ Tambah kuliah'));
  return box;
}

function renderAgendaEditor(day){
  const box = el('div', {class:'card'}, el('h2', null, 'Agenda'));
  day.agenda.forEach(a=>{
    box.appendChild(editRow([
      fieldInput(a.judul, 'Judul agenda', v=>a.judul=v),
      fieldInput(a.waktu, 'Jam', v=>a.waktu=v),
      fieldInput(a.ket, 'Keterangan', v=>a.ket=v)
    ], ()=>{ day.agenda = day.agenda.filter(x=>x.id!==a.id); saveWeek(activeWeek); refreshActiveWeekView(); }));
  });
  box.appendChild(el('button', {class:'add-row-btn', type:'button', onclick:()=>{
    day.agenda.push({id:uid(), judul:'', waktu:'', ket:''});
    saveWeek(activeWeek); refreshActiveWeekView();
  }}, '+ Tambah agenda'));
  return box;
}

function renderDeadlineEditor(day){
  const box = el('div', {class:'card deadline'}, el('h2', null, 'Deadline'));
  day.deadlines.forEach(dl=>{
    box.appendChild(editRow([
      fieldInput(dl.judul, 'Judul deadline', v=>dl.judul=v),
      fieldInput(dl.ket, 'Keterangan (opsional)', v=>dl.ket=v)
    ], ()=>{ day.deadlines = day.deadlines.filter(x=>x.id!==dl.id); saveWeek(activeWeek); refreshActiveWeekView(); }));
  });
  box.appendChild(el('button', {class:'add-row-btn', type:'button', onclick:()=>{
    day.deadlines.push({id:uid(), judul:'', ket:''});
    saveWeek(activeWeek); refreshActiveWeekView();
  }}, '+ Tambah deadline'));
  return box;
}

function renderFocusEditor(day){
  const box = el('div', {class:'card'}, el('h2', null, 'Fokus utama'));
  day.focus.forEach(f=>{
    box.appendChild(editRow([
      fieldInput(f.text, 'Fokus / tugas', v=>f.text=v)
    ], ()=>{ day.focus = day.focus.filter(x=>x.id!==f.id); saveWeek(activeWeek); refreshActiveWeekView(); }));
  });
  box.appendChild(el('button', {class:'add-row-btn', type:'button', onclick:()=>{
    day.focus.push({id:uid(), text:''});
    saveWeek(activeWeek); refreshActiveWeekView();
  }}, '+ Tambah fokus'));
  return box;
}

function renderDayEditor(day){
  const wrap = el('div', {class:'day'});
  wrap.id = 'day-'+day.id;
  wrap.appendChild(renderKuliahEditor(day));
  wrap.appendChild(renderAgendaEditor(day));
  wrap.appendChild(renderDeadlineEditor(day));
  wrap.appendChild(renderFocusEditor(day));
  return wrap;
}

function renderWeekSettingsPanel(){
  const panel = el('div', {class:'card edit-panel'}, el('h2', null, 'Pengaturan pekan'));

  panel.appendChild(el('div', {class:'field'},
    el('label', null, 'Label pekan'),
    fieldInput(activeWeek.label, 'mis. 7 – 13 September 2026', v=>{
      activeWeek.label = v;
      document.getElementById('eyebrow').textContent = v;
      document.title = 'MyList — ' + v;
    })
  ));

  const anchorField = el('div', {class:'field'}, el('label', null, 'Jangkar harian (berlaku untuk semua hari di pekan ini)'));
  const anchorGrid = el('div', {class:'anchors-grid'});
  activeWeek.anchors.forEach(a=>{
    anchorGrid.appendChild(el('div', {class:'pillcheck edit-pill'},
      el('span', {class:'dot2'}),
      el('input', {class:'pill-input', value:a.text, oninput:(e)=>{ a.text=e.target.value; persistActiveWeek(); }}),
      el('button', {class:'del-btn small', type:'button', 'aria-label':'Hapus jangkar', onclick:()=>{
        activeWeek.anchors = activeWeek.anchors.filter(x=>x.id!==a.id);
        saveWeek(activeWeek); refreshActiveWeekView();
      }}, '✕')
    ));
  });
  anchorGrid.appendChild(el('button', {class:'add-row-btn small', type:'button', onclick:()=>{
    activeWeek.anchors.push({id:uid(), text:'Jangkar baru'});
    saveWeek(activeWeek); refreshActiveWeekView();
  }}, '+ Jangkar'));
  anchorField.appendChild(anchorGrid);
  panel.appendChild(anchorField);

  const idxLen = getWeekIndex().length;
  panel.appendChild(el('div', {class:'panel-actions'},
    el('button', {class:'btn', type:'button', onclick:openNewWeekModal}, '+ Pekan baru'),
    el('button', {class:'btn btn-ghost', type:'button', onclick:exportData}, '⬇ Ekspor data'),
    el('button', {class:'btn btn-ghost', type:'button', onclick:()=>document.getElementById('importFile').click()}, '⬆ Impor data'),
    el('button', {class:'btn btn-danger', type:'button', disabled: idxLen<=1, onclick:deleteActiveWeek}, '🗑 Hapus pekan ini')
  ));

  return panel;
}

function openNewWeekModal(){
  const idx = getWeekIndex();
  let defaultStart;
  if(idx.length){
    const latest = idx.slice().sort().pop();
    const w = loadWeek(latest);
    const lastDay = new Date(w.days[w.days.length-1].id+'T00:00:00');
    lastDay.setDate(lastDay.getDate()+1);
    defaultStart = isoDate(lastDay);
  }else{
    defaultStart = todayISO();
  }

  const overlay = el('div', {class:'modal-overlay', onclick:(e)=>{ if(e.target===overlay) overlay.remove(); }});
  const dateInput = el('input', {type:'date', value:defaultStart, class:'f-input'});
  const card = el('div', {class:'modal-card'},
    el('h2', null, 'Buat pekan baru'),
    el('p', {class:'modal-desc'}, '7 hari berturut-turut akan dibuat otomatis mulai dari tanggal ini. Jangkar harian akan disalin dari pekan yang sedang dibuka.'),
    el('div', {class:'field'}, el('label', null, 'Tanggal mulai'), dateInput),
    el('div', {class:'modal-actions'},
      el('button', {class:'btn btn-ghost', type:'button', onclick:()=> overlay.remove()}, 'Batal'),
      el('button', {class:'btn', type:'button', onclick:()=>{
        const val = dateInput.value;
        if(!val) return;
        const start = new Date(val+'T00:00:00');
        const days = makeWeekDays(start);
        const weekId = days[0].id;
        if(getWeekRaw(weekId)){
          alert('Sudah ada pekan yang dimulai tanggal ini — pilih tanggal lain atau buka lewat dropdown Riwayat.');
          return;
        }
        const anchors = activeWeek ? activeWeek.anchors.map(a=>({id:uid(), text:a.text})) : normalizeAnchors(SEED_ANCHORS);
        saveWeek({ weekId, label: weekLabelFor(days), days, anchors });
        overlay.remove();
        editMode = true;
        setActiveWeek(weekId);
      }}, 'Buat')
    )
  );
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  dateInput.focus();
}

function deleteActiveWeek(){
  if(getWeekIndex().length <= 1) return;
  if(!confirm('Hapus jadwal, label, dan jangkar pekan ini? Catatan & status checklist per tanggal tetap tersimpan (tidak ikut terhapus), tapi tidak akan terlihat lagi sampai kamu buat ulang pekan dengan tanggal yang sama. Tindakan ini tidak bisa dibatalkan.')) return;
  deleteWeek(activeWeekId);
  setActiveWeek(pickHomeWeekId());
}

function exportData(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.indexOf(STORE_PREFIX) === 0){
      data[key.slice(STORE_PREFIX.length)] = localStorage.getItem(key);
    }
  }
  const payload = { app:'MyList', version:1, exportedAt:new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mylist-backup-'+todayISO()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(reader.result);
      if(!payload || typeof payload.data !== 'object') throw new Error('format tidak dikenali');
      if(!confirm('Impor akan menimpa data yang key-nya sama (pekan, checklist, catatan) dengan isi file ini. Lanjutkan?')) return;
      Object.keys(payload.data).forEach(k=> lsSet(k, payload.data[k]));
      alert('Impor berhasil. Halaman akan dimuat ulang.');
      location.reload();
    }catch(e){
      console.error('gagal impor', e);
      alert('Gagal impor: file tidak valid.');
    }
  };
  reader.readAsText(file);
}

document.getElementById('importFile').addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(f) importDataFromFile(f);
  e.target.value = '';
});

document.getElementById('editToggleBtn').addEventListener('click', ()=>{
  editMode = !editMode;
  refreshActiveWeekView(false);
});

// ---- populate dropdown riwayat ----
function populateWeekSelect(){
  const idx = getWeekIndex().slice().sort().reverse();
  const wrap = document.getElementById('weekSelectWrap');
  const sel = document.getElementById('weekSelect');
  if(idx.length === 0){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  const t = todayISO();
  sel.innerHTML = '';
  idx.forEach(id=>{
    const w = loadWeek(id);
    if(!w) return;
    const opt = document.createElement('option');
    opt.value = id;
    const isThisWeek = w.days.length && t >= w.days[0].id && t <= w.days[w.days.length-1].id;
    opt.textContent = w.label + (isThisWeek ? ' (pekan ini)' : '');
    sel.appendChild(opt);
  });
  sel.value = activeWeekId;
  sel.onchange = ()=>{ editMode = false; setActiveWeek(sel.value); };
}

// ---- switch / refresh pekan aktif ----
function setActiveWeek(weekId){
  activeWeekId = weekId;
  activeWeek = loadWeek(weekId);
  refreshActiveWeekView(true);
}

function refreshActiveWeekView(pickDefaultDay){
  if(!activeWeek) return;
  state = loadState(activeWeek.days, activeWeek.anchors);

  const settingsSlot = document.getElementById('editPanelSlot');
  settingsSlot.innerHTML = '';
  if(editMode) settingsSlot.appendChild(renderWeekSettingsPanel());

  const daysEl = document.getElementById('days');
  const activeEl = daysEl.querySelector('.day.active');
  const prevActiveDay = activeEl ? activeEl.id.replace('day-','') : null;
  daysEl.innerHTML = '';
  activeWeek.days.forEach(d=>{
    daysEl.appendChild(editMode ? renderDayEditor(d) : renderDay(d, activeWeek.anchors));
  });
  if(!editMode) document.querySelectorAll('.day').forEach(applyState);

  const t = todayISO();
  let defaultDay;
  if(pickDefaultDay){
    defaultDay = activeWeek.days.some(d=>d.id===t) ? t : activeWeek.days[0].id;
  }else{
    defaultDay = (prevActiveDay && activeWeek.days.some(d=>d.id===prevActiveDay)) ? prevActiveDay : activeWeek.days[0].id;
  }
  showDay(defaultDay);

  updateWeekProgress();
  document.getElementById('eyebrow').textContent = activeWeek.label;
  document.title = 'MyList — ' + activeWeek.label;

  populateWeekSelect();

  const btn = document.getElementById('editToggleBtn');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? '✓ Selesai edit' : '✏️ Edit pekan';
}

function init(){
  ensureSeeded();
  setActiveWeek(pickHomeWeekId());
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=> console.error('gagal daftar service worker', e));
  });
}
